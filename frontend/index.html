<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>APEX</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e;
          --accent:#3fb950; --danger:#f85149; --tool:#58a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  #auth { max-width:360px; margin:80px auto; padding:24px; background:var(--panel); border:1px solid var(--border); border-radius:8px; }
  #auth h1 { font-size:20px; margin-top:0; }
  #auth input { width:100%; padding:10px; margin:6px 0; background:#0d1117; border:1px solid var(--border); color:var(--text); border-radius:6px; }
  #auth button { width:100%; padding:10px; margin-top:8px; background:var(--accent); border:none; color:#04240e; font-weight:600; border-radius:6px; cursor:pointer; }
  #auth .toggle { color:var(--dim); text-align:center; margin-top:12px; cursor:pointer; font-size:13px; }
  #authError { color:var(--danger); font-size:13px; min-height:18px; }

  #app { display:none; max-width:800px; margin:0 auto; height:100vh; flex-direction:column; }
  #topbar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); }
  #topbar .brand { font-weight:700; }
  #quota { color:var(--dim); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px; }
  .msg { margin-bottom:14px; white-space:pre-wrap; line-height:1.5; }
  .msg.user { color:var(--text); }
  .msg.user .role { color:var(--accent); }
  .msg.assistant .role { color:var(--tool); }
  .msg .role { font-weight:700; margin-right:6px; }
  .toolcall { color:var(--tool); font-family: ui-monospace, monospace; font-size:13px; margin:4px 0; }
  .toolresult { color:var(--dim); font-family: ui-monospace, monospace; font-size:12px; background:#0d1117;
                border:1px solid var(--border); border-radius:6px; padding:8px; margin:4px 0; max-height:200px; overflow-y:auto; }
  .system-note { color:var(--danger); font-size:13px; }
  #inputbar { display:flex; gap:8px; padding:16px; border-top:1px solid var(--border); }
  #inputbar input { flex:1; padding:12px; background:var(--panel); border:1px solid var(--border); color:var(--text); border-radius:6px; }
  #inputbar button { padding:12px 20px; background:var(--accent); border:none; color:#04240e; font-weight:600; border-radius:6px; cursor:pointer; }
  #inputbar button:disabled { opacity:0.5; cursor:not-allowed; }
</style>
</head>
<body>

<div id="auth">
  <h1>APEX</h1>
  <div id="authError"></div>
  <input id="email" type="email" placeholder="email">
  <input id="password" type="password" placeholder="password">
  <button id="authSubmit">Sign up</button>
  <div class="toggle" id="authToggle">Already have an account? Log in</div>
</div>

<div id="app">
  <div id="topbar">
    <div class="brand">APEX</div>
    <div id="quota">-- / -- messages left today</div>
  </div>
  <div id="log"></div>
  <div id="inputbar">
    <input id="messageInput" placeholder="Ask APEX to do something in your sandbox...">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const API_BASE = window.APEX_API_BASE || window.location.origin.replace(/^http/, "http");
const WS_BASE = window.APEX_WS_BASE || window.location.origin.replace(/^http/, "ws");

let token = localStorage.getItem("apex_token") || null; // NOTE: fine for a local demo; a real
                                                          // production frontend should use an
                                                          // httpOnly cookie instead of localStorage.
let isSignup = true;
let ws = null;

const authDiv = document.getElementById("auth");
const appDiv = document.getElementById("app");
const authError = document.getElementById("authError");
const logDiv = document.getElementById("log");
const quotaDiv = document.getElementById("quota");

async function readJsonResponse(response) {
  const contentType = response.headers.get("content-type") || "";
  if (!contentType.includes("application/json")) {
    throw new Error("The APEX backend is not connected to this frontend.");
  }
  return response.json();
}

document.getElementById("authToggle").onclick = () => {
  isSignup = !isSignup;
  document.getElementById("authSubmit").textContent = isSignup ? "Sign up" : "Log in";
  document.getElementById("authToggle").textContent = isSignup
    ? "Already have an account? Log in" : "Need an account? Sign up";
};

document.getElementById("authSubmit").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const path = isSignup ? "/auth/signup" : "/auth/login";
  authError.textContent = "";
  try {
    const res = await fetch(API_BASE + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await readJsonResponse(res);
    if (!res.ok) { authError.textContent = data.detail || "Something went wrong."; return; }
    token = data.access_token;
    localStorage.setItem("apex_token", token);
    startApp();
  } catch (e) {
    authError.textContent = e.message;
  }
};

async function refreshQuota() {
  try {
    const res = await fetch(`${API_BASE}/me/quota?token=${encodeURIComponent(token)}`);
    const data = await res.json();
    quotaDiv.textContent = `${data.remaining_today} / ${data.daily_limit} messages left today`;
  } catch (e) { /* non-fatal */ }
}

function appendMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = `<span class="role">${role === "user" ? "you" : "apex"}</span>${escapeHtml(text)}`;
  logDiv.appendChild(div);
  logDiv.scrollTop = logDiv.scrollHeight;
}

function appendToolCall(name, input) {
  const div = document.createElement("div");
  div.className = "toolcall";
  div.textContent = `→ ${name}(${JSON.stringify(input)})`;
  logDiv.appendChild(div);
  logDiv.scrollTop = logDiv.scrollHeight;
}

function appendToolResult(output) {
  const div = document.createElement("div");
  div.className = "toolresult";
  div.textContent = output.length > 2000 ? output.slice(0, 2000) + "\n...[truncated]" : output;
  logDiv.appendChild(div);
  logDiv.scrollTop = logDiv.scrollHeight;
}

function appendSystemNote(text) {
  const div = document.createElement("div");
  div.className = "system-note";
  div.textContent = text;
  logDiv.appendChild(div);
  logDiv.scrollTop = logDiv.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function connectWs() {
  ws = new WebSocket(`${WS_BASE}/ws/chat?token=${encodeURIComponent(token)}`);
  ws.onmessage = (event) => {
    const { kind, payload } = JSON.parse(event.data);
    if (kind === "text") appendMessage("assistant", payload.text);
    else if (kind === "tool_call") appendToolCall(payload.name, payload.input);
    else if (kind === "tool_result") appendToolResult(payload.output);
    else if (kind === "quota_status") refreshQuota();
    else if (kind === "quota_exceeded") appendSystemNote(payload.message);
    else if (kind === "error") appendSystemNote("Error: " + payload.message);
    else if (kind === "stopped") appendSystemNote(payload.reason);
  };
  ws.onclose = () => appendSystemNote("Disconnected. Refresh to reconnect.");
}

document.getElementById("sendBtn").onclick = sendMessage;
document.getElementById("messageInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

function sendMessage() {
  const input = document.getElementById("messageInput");
  const text = input.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  appendMessage("user", text);
  ws.send(JSON.stringify({ message: text }));
  input.value = "";
}

function startApp() {
  authDiv.style.display = "none";
  appDiv.style.display = "flex";
  refreshQuota();
  connectWs();
}

if (token) startApp();
</script>
</body>
</html>
